function pick(o){return typeof o==='string'?o:(o[LG]||o.en)}

 document.getElementById('papT').innerHTML=tr([c.part,c.paper,c.data,c.score,c.ours],1)+D.papers.map(r=>tr([pick(r.part),`<a href="${r.url}" target="_blank" rel="noopener">${esc(r.paper)}</a>`,esc(r.data),esc(r.score),pick(r.ours||'—')])).join('');

 document.getElementById('dsT').innerHTML=tr([c.part,c.ds,c.size,c.tr,c.l],1)+D.datasets.map(r=>tr([pick(r.part),`<a href="${r.url}" target="_blank" rel="noopener">${esc(r.name)}</a>`,esc(r.size),r.tr?`<span class="g">${t('yes')}</span>`:t('no'),esc(r.lic)])).join('');
}

<script type="module">
import * as ort from 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.mjs';
ort.env.wasm.wasmPaths='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/';
ort.env.wasm.numThreads=1;
const CFG=D.plateCfg; const API='https://cekicin-ai-api.elasa2next.workers.dev/v1/vehicle/identify';
let det=null,ocr=null,loading=null;
async function sess(name){for(const u of ['models/plate/'+name,'https://huggingface.co/sosa123454321/cekicin-plate-tr-onnx/resolve/main/'+name]){
  try{const r=await fetch(u);if(!r.ok)continue;return await ort.InferenceSession.create(new Uint8Array(await r.arrayBuffer()),{executionProviders:['wasm']})}catch(e){}}
  throw new Error('model load failed: '+name)}
async function load(){if(!loading)loading=Promise.all([sess('plate_detector_yolov9t_384.onnx'),sess('plate_ocr_cct_s_v2.onnx')]).then(([a,b])=>{det=a;ocr=b;pRes.textContent='✓';});return loading}
load().then(()=>{if(!window.__lastPlate&&D.plateSamples[0])runPlateURL(D.plateSamples[0].src)}).catch(e=>pRes.textContent=e.message);
const TR_RE=/^(0[1-9]|[1-7][0-9]|8[01])([A-Z]{1,3})([0-9]{2,4})$/;
const L2D={O:'0',Q:'0',D:'0',I:'1',L:'1',Z:'2',S:'5',B:'8',G:'6',T:'7',A:'4'},D2L={'0':'O','1':'I','2':'Z','5':'S','8':'B','6':'G','7':'T','4':'A'};
function trFix(s){if(TR_RE.test(s))return s;for(const nl of [1,2,3])for(const nd of [2,3,4]){if(2+nl+nd!==s.length)continue;
  const c=[...s.slice(0,2)].map(x=>L2D[x]||x).join('')+[...s.slice(2,2+nl)].map(x=>D2L[x]||x).join('')+[...s.slice(2+nl)].map(x=>L2D[x]||x).join('');if(TR_RE.test(c))return c}return s}
function fmt(s){const m=TR_RE.exec(s);return m?`${m[1]} ${m[2]} ${m[3]}`:s}
function mask(s){const m=TR_RE.exec(s);return m?`${m[1]} ${m[2][0]}${'•'.repeat(m[2].length-1)} ${'•'.repeat(m[3].length)}`:s.slice(0,2)+'•'.repeat(Math.max(0,s.length-2))}
async function readPlate(img){
  await load(); const t0=performance.now(); const W=img.naturalWidth||img.width,H=img.naturalHeight||img.height,S=384;
  const r=Math.min(S/H,S/W),nw=Math.round(W*r),nh=Math.round(H*r),dw=(S-nw)/2,dh=(S-nh)/2;
  const c=new OffscreenCanvas(S,S),x=c.getContext('2d');x.fillStyle='rgb(114,114,114)';x.fillRect(0,0,S,S);x.drawImage(img,Math.round(dw-0.1),Math.round(dh-0.1),nw,nh);
  const px=x.getImageData(0,0,S,S).data,f=new Float32Array(3*S*S);for(let i=0;i<S*S;i++){f[i]=px[i*4]/255;f[S*S+i]=px[i*4+1]/255;f[2*S*S+i]=px[i*4+2]/255}
  const o=(await det.run({images:new ort.Tensor('float32',f,[1,3,S,S])})).output0;const n=o.dims[0],d=o.data,plates=[];
  for(let k=0;k<n;k++){const s=d[k*7+6];if(s<CFG.score_threshold)continue;
    let x1=(d[k*7+1]-dw)/r,y1=(d[k*7+2]-dh)/r,x2=(d[k*7+3]-dw)/r,y2=(d[k*7+4]-dh)/r;x1=Math.max(0,Math.floor(x1));y1=Math.max(0,Math.floor(y1));x2=Math.min(W,Math.ceil(x2));y2=Math.min(H,Math.ceil(y2));
    if(x2-x1<4||y2-y1<4)continue;const oc=new OffscreenCanvas(128,64),ox=oc.getContext('2d');ox.imageSmoothingQuality='medium';ox.drawImage(img,x1,y1,x2-x1,y2-y1,0,0,128,64);
    const q=ox.getImageData(0,0,128,64).data,u=new Uint8Array(64*128*3);for(let i=0;i<64*128;i++){u[i*3]=q[i*4];u[i*3+1]=q[i*4+1];u[i*3+2]=q[i*4+2]}
    const out=await ocr.run({input:new ort.Tensor('uint8',u,[1,64,128,3])});const P=out.plate.data,A=CFG.alphabet,V=A.length;let txt='',cs=[];
    for(let j=0;j<CFG.max_plate_slots;j++){let bi=0,bv=-1;for(let a=0;a<V;a++){const v=P[j*V+a];if(v>bv){bv=v;bi=a}}const ch=A[bi];if(ch!==CFG.pad_char){txt+=ch;cs.push(bv)}}
    const R=out.region.data;let ri=0;for(let a=1;a<R.length;a++)if(R[a]>R[ri])ri=a;
    plates.push({box:[x1,y1,x2,y2],det:s,raw:txt,text:trFix(txt),ok_tr:TR_RE.test(trFix(txt)),conf:cs.length?cs.reduce((a,b)=>a+b,0)/cs.length:0,country:CFG.plate_regions[ri],country_p:R[ri]})}
  plates.sort((a,b)=>(b.ok_tr-a.ok_tr)||(b.det-a.det));return {plates,ms:Math.round(performance.now()-t0),W,H}}
window.__plate=async url=>{const im=await loadImg(url);return readPlate(im)};
function loadImg(src){return new Promise((ok,no)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>ok(i);i.onerror=no;i.src=src})}
function draw(img,res){const cv=pCv,mx=640,s=Math.min(1,mx/res.W);cv.width=Math.round(res.W*s);cv.height=Math.round(res.H*s);const x=cv.getContext('2d');x.drawImage(img,0,0,cv.width,cv.height);
  for(const p of res.plates){const [a,b,c,d]=p.box.map(v=>v*s);if(!pShow.checked){x.save();x.filter='blur(7px)';x.drawImage(img,p.box[0],p.box[1],p.box[2]-p.box[0],p.box[3]-p.box[1],a,b,c-a,d-b);x.restore()}
    x.lineWidth=3;x.strokeStyle='#e8590c';x.strokeRect(a,b,c-a,d-b)}}
window.showPlate=function(st){const {img,res}=st;draw(img,res);if(!res.plates.length){pRes.innerHTML=`<b>${t('none')}</b> · ${res.ms} ms`;return}
  pRes.innerHTML=res.plates.slice(0,3).map(p=>`<div style="margin:4px 0"><span class="plate">${esc(pShow.checked?fmt(p.text):mask(p.text))}</span>
  <div><small>${t('found')}: ${(p.det*100).toFixed(0)}% · OCR ${t('conf')}: ${(p.conf*100).toFixed(0)}% · ${t('fixed')}: ${p.ok_tr?'✓':'✗'} · ${t('country')}: ${esc(p.country)} (${(p.country_p*100).toFixed(0)}%) · ${t('time')}: ${res.ms} ms</small></div></div>`).join('')}
async function runPlate(img){pRes.textContent=t('busy');try{const res=await readPlate(img);window.__lastPlate={img,res};showPlate(window.__lastPlate)}catch(e){pRes.textContent=t('err')+': '+e.message}}
window.runPlateURL=async u=>runPlate(await loadImg(u));
pFile.onchange=()=>{const f=pFile.files[0];if(f){const u=URL.createObjectURL(f);runPlateURL(u)}};pShow.onchange=()=>{if(window.__lastPlate)showPlate(window.__lastPlate)};
// make / model
async function toDataURL(src){const im=await loadImg(src);const s=Math.min(1,768/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.85)}
window.showCar=function(j){const v=j.vehicle||{};if(!v.make){cRes.innerHTML=`<b>${t('noCar')}</b>`;return}
  cRes.innerHTML=(j.cached?`<div class="note">${t(j.quota?'cachedN':'cachedG')}<br><small>${esc(j.why||'')}</small></div>`:'')+`<div style="font-size:22px;font-weight:700">${esc(v.make)} ${esc(v.model||'')}</div><small>${t('body')}: ${esc(v.body||'—')} · ${t('yrs')}: ${v.year_from||'?'}–${v.year_to||'?'} · ${t('conf')}: ${Math.round((v.confidence||0)*100)}% · ${esc((j.model||'').split('/').pop())}${j.cached?'':' · '+j.ms+' ms'}</small>`+(j.cached?`<div><small>${t('truth')}: <b>${esc(j.cached.truth)}</b> ${j.cached.ok?'✓':'✗'}</small></div>`:'')}
async function runCar(src,sample){cImg.src=src;cImg.style.display='block';cRes.textContent=t('busy');
  try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({image:await toDataURL(src),lang:LG})});const j=await r.json();
    if(!r.ok){const e=new Error((j.error&&j.error.message)||j.message||r.status);e.code=j.error&&j.error.code;throw e}window.__lastCar=j;showCar(j)}catch(e){
    if(sample&&sample.cached){const c=sample.cached;window.__lastCar={vehicle:{make:c.make,model:c.model,confidence:c.confidence},model:'llama-4-scout',ms:'—',cached:c,quota:e.code==='daily_ai_quota',why:e.code==='daily_ai_quota'?'':e.message};showCar(window.__lastCar)}else cRes.textContent=(e.code==='daily_ai_quota'||e.code==='demo_quota')?t('quotaU'):e.code==='rate_limited'?t('rateU'):t('err')+': '+e.message}}
window.runCarURL=runCar;cFile.onchange=()=>{const f=cFile.files[0];if(f)runCar(URL.createObjectURL(f))};
</script></body></html>
